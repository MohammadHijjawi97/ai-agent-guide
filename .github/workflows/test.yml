name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check imports
        run: python -c "from openai import OpenAI; from dotenv import load_dotenv; import requests; print('All imports OK')"

      - name: Run unit tests
        run: python -m pytest tests/ -v
        if: ${{ hashFiles('tests/**') != '' }}

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 lessons/ --max-line-length=100 --ignore=E302,W503
